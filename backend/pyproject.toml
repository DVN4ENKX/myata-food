[project]
name = "myata-food-api"
version = "1.0.0"
description = "Backend for Myata Food: e-menu, QR codes per table, hall occupancy"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "pyjwt>=2.9.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "segno>=1.6.0",
    "psycopg[binary]>=3.2.0",
    "python-dateutil>=2.9.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "websockets>=13.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# tests/ holds standalone integration scripts that need a live server and end
# with sys.exit, so they must stay out of pytest collection:
#   python tests/reset_dev.py && python tests/smoke_test.py
python_files = ["test_*.py"]
