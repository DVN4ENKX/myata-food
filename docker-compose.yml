services:
  db:
    image: postgres:16-alpine
    container_name: myata-food-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-myata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-myata}
      POSTGRES_DB: ${POSTGRES_DB:-myata_food}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myata} -d ${POSTGRES_DB:-myata_food}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: myata-food-api
    restart: unless-stopped
    command: >-
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-myata}:${POSTGRES_PASSWORD:-myata}@db:5432/${POSTGRES_DB:-myata_food}
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-long-random-string}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:5173}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    volumes:
      - ./backend/storage:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8000}
    container_name: myata-food-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
