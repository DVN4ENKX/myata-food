# "upgrade" for websockets, "close" for plain HTTP (must live in the http context)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 8m;

    # QR menu is a single-page app: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ^~ is required: regex locations below are checked before plain prefix
    # matches, so without it /api/.../qr.png would be served from disk and 404
    location ^~ /static/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location = /health {
        proxy_pass http://api:8000;
    }

    # WebSocket channels live under /api/ws/*, so the upgrade must be handled here
    location ^~ /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~* \.(js|css|svg|png|jpg|jpeg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
